<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港巴士到站查詢</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', 'Microsoft YaHei', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 16px;
  }
  .container { max-width: 700px; margin: 0 auto; }
  h1 {
    font-size: 20px;
    margin-bottom: 12px;
    color: #58a6ff;
    text-align: center;
  }
  /* ===== 頂部按鈕列 ===== */
  .top-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .top-btn {
    flex: 1;
    padding: 12px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #e6edf3;
    transition: all 0.15s;
  }
  .top-btn:hover { background: #1c2128; border-color: #58a6ff; }
  .top-btn.favorites-btn { background: #1c2128; border-color: #f5a623; color: #f5a623; }
  .top-btn.favorites-btn:hover { background: #2d2a1f; }
  .top-btn.back-btn { background: #30363d; border-color: #30363d; color: #8b949e; }
  /* ===== 視圖 ===== */
  .favorites-view { display: none; }
  .favorites-view.active { display: block; }
  .search-view { display: none; }
  .search-view.active { display: block; }
  /* ===== 常用路線視圖 ===== */
  .favorites-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .favorites-title {
    font-size: 16px;
    font-weight: 600;
    color: #f5a623;
  }
  .favorites-refresh-info {
    font-size: 11px;
    color: #8b949e;
  }
  .fav-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .fav-card-header {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
  }
  .fav-company-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
  }
  .fav-company-tag.kmb { background: #d40000; color: white; }
  .fav-company-tag.ctb { background: #f5a623; color: #000; }
  .fav-company-tag.gmb { background: #2da44e; color: white; }
  .fav-route {
    font-size: 18px;
    font-weight: 700;
    color: #58a6ff;
  }
  .fav-stop-name {
    font-size: 14px;
    color: #e6edf3;
    margin-left: 4px;
  }
  .fav-usage {
    font-size: 11px;
    color: #8b949e;
    background: #21262d;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: auto;
  }
  /* ===== Tag 分組 ===== */
  .fav-group {
    margin-bottom: 16px;
  }
  .fav-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: linear-gradient(135deg, #21262d 0%, #161b22 100%);
    border-left: 3px solid #f5a623;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .fav-group-title {
    font-size: 15px;
    font-weight: 700;
    color: #f5a623;
  }
  .fav-group-count {
    font-size: 11px;
    color: #8b949e;
    background: #30363d;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .fav-group .fav-card {
    margin-left: 8px;
  }
  /* ===== Tag 篩選 ===== */
  .tag-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
    padding: 10px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
  }
  .tag-filter-label {
    font-size: 11px;
    color: #8b949e;
    align-self: center;
    margin-right: 4px;
  }
  .tag-chip {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid #30363d;
    background: #21262d;
    color: #8b949e;
    transition: all 0.15s;
    user-select: none;
  }
  .tag-chip:hover { border-color: #58a6ff; }
  .tag-chip.active {
    background: #1f6feb;
    border-color: #1f6feb;
    color: white;
  }
  .tag-chip.hidden-tag {
    background: #21262d;
    border-color: #30363d;
    color: #484f58;
    text-decoration: line-through;
  }
  .fav-eta-list { list-style: none; }
  .fav-eta-item {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #21262d;
  }
  .fav-eta-item:last-child { border-bottom: none; }
  .fav-eta-time {
    font-size: 16px;
    font-weight: 700;
    color: #3fb950;
    min-width: 60px;
  }
  .fav-eta-countdown {
    font-size: 12px;
    color: #8b949e;
    margin-left: 10px;
  }
  .fav-eta-dest {
    font-size: 11px;
    color: #6e7681;
    margin-left: auto;
    text-align: right;
  }
  .fav-loading {
    text-align: center;
    padding: 20px;
    color: #8b949e;
    font-size: 13px;
  }
  .fav-error {
    background: #3d1f1f;
    border: 1px solid #f85149;
    color: #f85149;
    padding: 10px;
    border-radius: 6px;
    text-align: center;
    font-size: 12px;
  }
  .fav-empty {
    color: #6e7681;
    text-align: center;
    padding: 12px;
    font-size: 12px;
  }
  /* ===== 搜尋視圖 ===== */
  .company-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .company-tab {
    flex: 1;
    padding: 10px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }
  .company-tab.active {
    background: #1f6feb;
    border-color: #1f6feb;
    color: white;
  }
  .company-tab.kmb.active { background: #d40000; border-color: #d40000; }
  .company-tab.ctb.active { background: #f5a623; border-color: #f5a623; color: #000; }
  .company-tab.gmb.active { background: #2da44e; border-color: #2da44e; }
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    outline: none;
  }
  input[type="text"]:focus { border-color: #58a6ff; }
  button {
    padding: 12px 20px;
    font-size: 15px;
    background: #238636;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #2ea043; }
  .direction-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .dir-tab {
    flex: 1;
    padding: 10px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
  }
  .dir-tab.active {
    background: #1f6feb;
    border-color: #1f6feb;
    color: white;
  }
  .dir-tab .route-name { font-weight: 600; font-size: 14px; }
  .dir-tab .route-desc { font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .stop-list { list-style: none; }
  .stop-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .stop-item:hover {
    border-color: #58a6ff;
    background: #1c2128;
  }
  .stop-item.selected {
    border-color: #f5a623;
    background: #1c2128;
  }
  .stop-seq {
    width: 28px;
    height: 28px;
    background: #30363d;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .stop-info { flex: 1; min-width: 0; }
  .stop-name { font-size: 14px; font-weight: 500; margin-bottom: 1px; }
  .stop-id {
    font-size: 11px;
    color: #8b949e;
    font-family: 'Consolas', monospace;
  }
  .loading {
    text-align: center;
    padding: 30px;
    color: #8b949e;
  }
  .error {
    background: #3d1f1f;
    border: 1px solid #f85149;
    color: #f85149;
    padding: 14px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
  }
  /* ===== ETA Panel - 插入到車站之間 ===== */
  .eta-inline-panel {
    background: #161b22;
    border: 1px solid #f5a623;
    border-radius: 10px;
    padding: 14px;
    margin: 0 0 6px 0;
    margin-left: 20px;
    animation: slideDown 0.2s ease-out;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .eta-inline-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .eta-inline-title {
    font-size: 14px;
    font-weight: 600;
    color: #f5a623;
  }
  .eta-inline-refresh {
    font-size: 11px;
    color: #8b949e;
  }
  .eta-list { list-style: none; margin-bottom: 10px; }
  .eta-item {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #21262d;
  }
  .eta-item:last-child { border-bottom: none; }
  .eta-time {
    font-size: 16px;
    font-weight: 700;
    color: #3fb950;
    min-width: 60px;
  }
  .eta-countdown {
    font-size: 12px;
    color: #8b949e;
    margin-left: 10px;
  }
  .eta-dest {
    font-size: 11px;
    color: #6e7681;
    margin-left: auto;
    text-align: right;
  }
  .eta-empty {
    color: #6e7681;
    text-align: center;
    padding: 12px;
    font-size: 12px;
  }
  .refresh-btn {
    padding: 4px 10px;
    font-size: 11px;
    background: #30363d;
    border-radius: 4px;
    color: #e6edf3;
  }
  .refresh-btn:hover { background: #484f58; }
  /* ===== 地圖 ===== */
  .stop-map {
    width: 100%;
    height: 180px;
    border-radius: 8px;
    border: 1px solid #30363d;
    margin-top: 10px;
    overflow: hidden;
  }
  .stop-map iframe {
    width: 100%;
    height: 100%;
    border: none;
    filter: invert(0.9) hue-rotate(180deg);
  }
  .map-link {
    display: block;
    text-align: center;
    font-size: 11px;
    color: #58a6ff;
    margin-top: 6px;
    text-decoration: none;
  }
  .map-link:hover { text-decoration: underline; }
  .hint {
    text-align: center;
    color: #8b949e;
    font-size: 12px;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🚌 香港巴士到站查詢</h1>
  <!-- ===== 頂部按鈕列 ===== -->
  <div class="top-bar">
    <div class="top-btn favorites-btn" onclick="showFavorites()">⭐ 常用路線</div>
    <div class="top-btn back-btn" id="backBtn" onclick="showSearch()" style="display:none;">← 返回搜尋</div>
  </div>
  <!-- ===== 常用路線視圖 ===== -->
  <div class="favorites-view" id="favoritesView">
    <div class="favorites-header">
      <span class="favorites-title">⭐ 常用路線到站時間</span>
      <span class="favorites-refresh-info" id="favRefreshInfo">每30秒自動更新</span>
    </div>
    <div class="tag-filter" id="tagFilter">
      <span class="tag-filter-label">篩選：</span>
    </div>
    <div id="favoritesContent">
      <div class="fav-loading">載入中...</div>
    </div>
  </div>
  <!-- ===== 搜尋視圖 ===== -->
  <div class="search-view active" id="searchView">
    <div class="company-tabs">
      <div class="company-tab kmb active" id="tabKMB" onclick="switchCompany('KMB')">九巴 KMB</div>
      <div class="company-tab ctb" id="tabCTB" onclick="switchCompany('CTB')">城巴/新巴</div>
      <div class="company-tab gmb" id="tabGMB" onclick="switchCompany('GMB')">小巴 GMB</div>
    </div>
    <div class="search-box">
      <input type="text" id="routeInput" placeholder="輸入路線號，例如：101、S1、901" />
      <button onclick="searchRoute()">查詢</button>
    </div>
    <div id="directionTabs"></div>
    <div id="result"></div>
  </div>
  <div class="hint">資料來源：data.gov.hk</div>
</div>
<script>
let currentCompany = 'KMB';
let currentDirections = [];
let currentDirIndex = 0;
let currentStops = [];
let selectedStopIndex = -1;
let refreshTimer = null;
let favoritesTimer = null;
let activeTags = new Set(); // 當前顯示的 Tag
let allTags = []; // 所有可用的 Tag

const KMB_API = 'https://data.etabus.gov.hk/v1/transport/kmb';
const CTB_API = 'https://rt.data.gov.hk/v1/transport/citybus-nwfb';
const CTB_BATCH_API = 'https://rt.data.gov.hk/v1/transport/batch';
const GMB_API = 'https://data.etagmb.gov.hk';

// ===== 常用路線數據 =====
let FAVORITES = [];

// 從 favorites.json 載入常用路線
async function initFavorites() {
  try {
    const res = await fetch('favorites.json?t=' + Date.now());
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        FAVORITES = data;
        console.log('已從 favorites.json 載入 ' + data.length + ' 條常用路線');
      }
    }
  } catch (err) {
    console.log('無法載入 favorites.json：' + err.message);
  }

  // 初始化 Tag 篩選（預設全部顯示）
  initTagFilter();

  // 預設顯示常用路線
  showFavorites();
}

window.addEventListener('DOMContentLoaded', initFavorites);

// ===== Tag 篩選 =====
function initTagFilter() {
  // 提取所有唯一的 usage Tag
  const tagSet = new Set();
  for (const fav of FAVORITES) {
    if (fav.usage) {
      tagSet.add(fav.usage);
    }
  }
  allTags = Array.from(tagSet);
  // 預設只 TOGGLE ON "上班"同"下班" Tag，其他 Tag 預設隱藏
  const DEFAULT_TAGS = ['上班', '下班'];
  activeTags = new Set(allTags.filter(tag => DEFAULT_TAGS.includes(tag)));

  renderTagFilter();
}

function renderTagFilter() {
  const container = document.getElementById('tagFilter');
  if (!container) return;

  let html = '<span class="tag-filter-label">篩選：</span>';

  // 全部顯示/全部隱藏按鈕
  html += `<span class="tag-chip ${activeTags.size === allTags.length ? 'active' : ''}" onclick="toggleAllTags()">全部</span>`;

  // 各個 Tag
  for (const tag of allTags) {
    const isActive = activeTags.has(tag);
    html += `<span class="tag-chip ${isActive ? 'active' : 'hidden-tag'}" onclick="toggleTag('${tag}')">${tag}</span>`;
  }

  container.innerHTML = html;
}

function toggleTag(tag) {
  if (activeTags.has(tag)) {
    activeTags.delete(tag);
  } else {
    activeTags.add(tag);
  }
  renderTagFilter();
  loadFavoritesETA();
}

function toggleAllTags() {
  if (activeTags.size === allTags.length) {
    activeTags.clear(); // 全部隱藏
  } else {
    activeTags = new Set(allTags); // 全部顯示
  }
  renderTagFilter();
  loadFavoritesETA();
}

// ===== 視圖切換 =====
function showFavorites() {
  document.getElementById('favoritesView').classList.add('active');
  document.getElementById('searchView').classList.remove('active');
  document.getElementById('backBtn').style.display = 'block';
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  loadFavoritesETA();
  favoritesTimer = setInterval(loadFavoritesETA, 30000);
}

function showSearch() {
  document.getElementById('favoritesView').classList.remove('active');
  document.getElementById('searchView').classList.add('active');
  document.getElementById('backBtn').style.display = 'none';
  if (favoritesTimer) { clearInterval(favoritesTimer); favoritesTimer = null; }
}

// ===== 載入常用路線到站時間 =====
async function loadFavoritesETA() {
  const content = document.getElementById('favoritesContent');
  content.innerHTML = '<div class="fav-loading">載入到站時間...</div>';

  try {
    const now = new Date();
    let html = '';

    // 按 Tag 分組
    const groups = new Map();
    for (const fav of FAVORITES) {
      // Tag 篩選：如果有 usage 且唔在 activeTags 中，跳過
      if (fav.usage && !activeTags.has(fav.usage)) {
        continue;
      }
      const tag = fav.usage || '其他';
      if (!groups.has(tag)) {
        groups.set(tag, []);
      }
      groups.get(tag).push(fav);
    }

    // 按 Tag 順序顯示（優先顯示 activeTags 中的順序）
    const sortedTags = [...groups.keys()].sort((a, b) => {
      const aIdx = allTags.indexOf(a);
      const bIdx = allTags.indexOf(b);
      if (aIdx === -1 && bIdx === -1) return a.localeCompare(b);
      if (aIdx === -1) return 1;
      if (bIdx === -1) return -1;
      return aIdx - bIdx;
    });

    for (const tag of sortedTags) {
      const favs = groups.get(tag);
      html += `<div class="fav-group">`;
      html += `<div class="fav-group-header"><span class="fav-group-title">${tag}</span><span class="fav-group-count">${favs.length} 個站</span></div>`;

      for (const fav of favs) {
        try {
          let url;
          if (fav.company === 'KMB') {
            url = `${KMB_API}/eta/${fav.stopId}/${fav.route}/${fav.service_type || '1'}`;
          } else if (fav.company === 'CTB') {
            url = `${CTB_BATCH_API}/stop-eta/CTB/${fav.stopId}`;
          } else if (fav.company === 'GMB') {
            url = `${GMB_API}/eta/stop/${fav.stopId}`;
          }

          const res = await fetch(url);
          const data = await res.json();

          let etas = [];
          if (fav.company === 'KMB') {
            // 九巴：按方向過濾
            etas = (data.data || []).filter(e => e.eta && e.dir === fav.dir);
          } else if (fav.company === 'CTB') {
            etas = (data.data || []).filter(e => e.eta && e.route === fav.route && e.dir === fav.dir);
          } else if (fav.company === 'GMB') {
            // 小巴 API：data.data 是數組，每個元素包含 eta 數組
            for (const item of (data.data || [])) {
              if (item.eta && Array.isArray(item.eta)) {
                etas = etas.concat(item.eta);
              }
            }
          }
          etas = etas.slice(0, 3);

          const companyTag = fav.company === 'KMB' ? 'kmb' : (fav.company === 'CTB' ? 'ctb' : 'gmb');
          const companyName = fav.company === 'KMB' ? '九巴' : (fav.company === 'CTB' ? '城巴' : '小巴');

          if (etas.length === 0) {
            html += `
              <div class="fav-card">
                <div class="fav-card-header">
                  <span class="fav-company-tag ${companyTag}">${companyName}</span>
                  <span class="fav-route">${fav.route}</span>
                  <span class="fav-stop-name">${fav.stopName}</span>
                </div>
                <div class="fav-empty">暫無到站數據</div>
              </div>
            `;
          } else {
            const etaHtml = etas.map(e => {
              const etaTime = new Date(e.eta || e.timestamp);
              const diffMs = etaTime - now;
              const diffMin = Math.round(diffMs / 60000);
              const timeStr = etaTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
              const countdown = diffMin > 0 ? `${diffMin} 分鐘後` : (diffMin === 0 ? '即將到達' : '已過站');
              let dest = (e.dest && e.dest.zh) || e.dest_tc || (typeof e.dest === 'string' ? e.dest : '');
              if (!dest && fav) dest = fav.dir === 'I' ? '元朗(德業街)' : '東涌(逸東)';
              return `
                <div class="fav-eta-item">
                  <div class="fav-eta-time">${timeStr}</div>
                  <div class="fav-eta-countdown">${countdown}</div>
                  <div class="fav-eta-dest">${dest}</div>
                </div>
              `;
            }).join('');

            html += `
              <div class="fav-card">
                <div class="fav-card-header">
                  <span class="fav-company-tag ${companyTag}">${companyName}</span>
                  <span class="fav-route">${fav.route}</span>
                  <span class="fav-stop-name">${fav.stopName}</span>
                </div>
                <div class="fav-eta-list">${etaHtml}</div>
              </div>
            `;
          }
        } catch (err) {
          html += `
            <div class="fav-card">
              <div class="fav-card-header">
                <span class="fav-route">${fav.route}</span>
                <span class="fav-stop-name">${fav.stopName}</span>
              </div>
              <div class="fav-error">載入失敗：${err.message}</div>
            </div>
          `;
        }
      }

      html += `</div>`;
    }

    if (sortedTags.length === 0) {
      html = '<div class="fav-empty">沒有符合篩選條件的常用路線</div>';
    }

    content.innerHTML = html;
    const timeStr = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('favRefreshInfo').textContent = `最後更新 ${timeStr} · 每30秒自動更新`;
  } catch (err) {
    content.innerHTML = `<div class="fav-error">載入失敗：${err.message}</div>`;
  }
}

document.getElementById('routeInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') searchRoute();
});

// ===== 公司切換 =====
function switchCompany(company) {
  currentCompany = company;
  document.getElementById('tabKMB').classList.toggle('active', company === 'KMB');
  document.getElementById('tabCTB').classList.toggle('active', company === 'CTB');
  document.getElementById('tabGMB').classList.toggle('active', company === 'GMB');
  document.getElementById('directionTabs').innerHTML = '';
  document.getElementById('result').innerHTML = '';
  selectedStopIndex = -1;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

// ===== 路線搜尋 =====
async function searchRoute() {
  const route = document.getElementById('routeInput').value.trim().toUpperCase();
  if (!route) return;

  const resultDiv = document.getElementById('result');
  const tabsDiv = document.getElementById('directionTabs');
  resultDiv.innerHTML = '<div class="loading">查詢中...</div>';
  tabsDiv.innerHTML = '';
  selectedStopIndex = -1;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }

  try {
    let routes = [];
    if (currentCompany === 'KMB') {
      const res = await fetch(`${KMB_API}/route/`);
      const data = await res.json();
      routes = data.data.filter(r => r.route === route);
    } else if (currentCompany === 'CTB') {
      const res = await fetch(`${CTB_API}/route/ctb`);
      const data = await res.json();
      const matched = data.data.filter(r => r.route === route);
      if (matched.length > 0 && !matched[0].dir) {
        const r = matched[0];
        routes = [
          { ...r, dir: 'O', orig_tc: r.orig_tc, dest_tc: r.dest_tc },
          { ...r, dir: 'I', orig_tc: r.dest_tc, dest_tc: r.orig_tc }
        ];
      } else {
        routes = matched;
      }
    } else if (currentCompany === 'GMB') {
      // 小巴：在三個區域中搜索路線
      const regions = ['NT', 'KLN', 'HKI'];
      for (const region of regions) {
        try {
          const res = await fetch(`${GMB_API}/route/${region}`);
          const data = await res.json();
          if (data.data && data.data.routes && data.data.routes.includes(route)) {
            const detailRes = await fetch(`${GMB_API}/route/${region}/${route}`);
            const detailData = await detailRes.json();
            if (detailData.data && detailData.data.length > 0) {
              const routeInfo = detailData.data[0];
              for (const dir of routeInfo.directions) {
                routes.push({
                  route: route,
                  route_id: routeInfo.route_id,
                  region: region,
                  dir: dir.route_seq,
                  orig_tc: dir.orig_tc,
                  dest_tc: dir.dest_tc,
                  service_type: '1'
                });
              }
            }
            break;
          }
        } catch (e) { continue; }
      }
    }

    if (routes.length === 0) {
      resultDiv.innerHTML = `<div class="error">搵唔到路線「${route}」<br>請檢查路線號或巴士公司</div>`;
      return;
    }

    currentDirections = routes;
    currentDirIndex = 0;
    renderDirectionTabs();
    loadStops();
  } catch (err) {
    resultDiv.innerHTML = `<div class="error">查詢失敗：${err.message}</div>`;
  }
}

function renderDirectionTabs() {
  const tabsDiv = document.getElementById('directionTabs');
  if (currentDirections.length <= 1) { tabsDiv.innerHTML = ''; return; }

  tabsDiv.innerHTML = currentDirections.map((r, i) => {
    let orig, dest;
    if (currentCompany === 'KMB') {
      orig = r.orig_tc; dest = r.dest_tc;
    } else {
      orig = r.orig_tc || r.origin_tc || '';
      dest = r.dest_tc || r.destination_tc || '';
    }
    return `
      <div class="dir-tab ${i === currentDirIndex ? 'active' : ''}" onclick="switchDir(${i})">
        <div class="route-name">${(r.direction === 'I' || r.direction === '2' || r.dir === 'I' || r.bound === 'I') ? '回程' : '去程'}</div>
        <div class="route-desc">${orig} → ${dest}</div>
      </div>
    `;
  }).join('');
}

function switchDir(index) {
  currentDirIndex = index;
  selectedStopIndex = -1;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  renderDirectionTabs();
  loadStops();
}

// ===== 載入車站列表 =====
async function loadStops() {
  const route = currentDirections[currentDirIndex];
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = '<div class="loading">載入車站列表...</div>';

  try {
    let stops = [];

    if (currentCompany === 'KMB') {
      const bound = route.bound === 'O' ? 'outbound' : 'inbound';
      const url = `${KMB_API}/route-stop/${route.route}/${bound}/${route.service_type}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.data || data.data.length === 0) {
        resultDiv.innerHTML = '<div class="error">呢條路線冇車站資料</div>';
        return;
      }
      for (const item of data.data) {
        const stopId = item.stop;
        const seq = item.seq;
        const stopRes = await fetch(`${KMB_API}/stop/${stopId}`);
        const stopData = await stopRes.json();
        const sd = stopData.data;
        stops.push({
          seq: seq,
          id: stopId,
          name: sd.name_tc || sd.name || '',
          lat: sd.lat || sd.latitude || '',
          long: sd.long || sd.longitude || sd.lng || ''
        });
      }
    } else if (currentCompany === 'CTB') {
      const bound = route.dir === 'I' ? 'inbound' : 'outbound';
      const url = `${CTB_API}/route-stop/ctb/${route.route}/${bound}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.data || data.data.length === 0) {
        resultDiv.innerHTML = '<div class="error">呢條路線冇車站資料</div>';
        return;
      }
      for (const item of data.data) {
        const stopId = item.stop;
        const seq = item.seq || item.stop_seq;
        const stopRes = await fetch(`${CTB_API}/stop/${stopId}`);
        const stopData = await stopRes.json();
        const sd = stopData.data;
        stops.push({
          seq: seq,
          id: stopId,
          name: sd.name_tc || sd.name || '',
          lat: sd.lat || sd.latitude || '',
          long: sd.long || sd.longitude || sd.lng || ''
        });
      }
    } else if (currentCompany === 'GMB') {
      // 小巴：用 route_id 和 route_seq 獲取車站
      const url = `${GMB_API}/route-stop/${route.route_id}/${route.dir}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.data || !data.data.route_stops || data.data.route_stops.length === 0) {
        resultDiv.innerHTML = '<div class="error">呢條路線冇車站資料</div>';
        return;
      }
      for (const item of data.data.route_stops) {
        stops.push({
          seq: item.stop_seq || item.seq,
          id: item.stop_id,
          name: item.name_tc || item.name || '',
          lat: item.lat || item.latitude || '',
          long: item.long || item.longitude || item.lng || ''
        });
      }
    }

    currentStops = stops;
    renderStops(stops);
  } catch (err) {
    resultDiv.innerHTML = `<div class="error">載入失敗：${err.message}</div>`;
  }
}

function renderStops(stops) {
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = `
    <ul class="stop-list" id="stopList">
      ${stops.map((s, i) => `
        <li class="stop-item" id="stop-${i}" onclick="selectStop(${i})">
          <div class="stop-seq">${s.seq}</div>
          <div class="stop-info">
            <div class="stop-name">${s.name}</div>
            <div class="stop-id">${s.id}</div>
          </div>
        </li>
      `).join('')}
    </ul>
  `;
}

// ===== 點擊車站：插入 ETA panel 到車站之間 =====
async function selectStop(index) {
  if (selectedStopIndex === index) {
    removeEtaPanel();
    selectedStopIndex = -1;
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    renderStops(currentStops);
    return;
  }

  removeEtaPanel();
  selectedStopIndex = index;

  document.querySelectorAll('.stop-item').forEach((el, i) => {
    el.classList.toggle('selected', i === index);
  });

  const stopEl = document.getElementById(`stop-${index}`);
  const etaPanel = document.createElement('li');
  etaPanel.id = 'eta-inline-panel';
  etaPanel.className = 'eta-inline-panel';
  etaPanel.innerHTML = `
    <div class="eta-inline-header">
      <span class="eta-inline-title">📍 ${currentStops[index].name}</span>
      <span class="eta-inline-refresh">載入中...</span>
    </div>
    <div class="loading" style="padding:15px;">載入到站時間...</div>
  `;
  stopEl.after(etaPanel);
  etaPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  await loadETA(index);

  if (refreshTimer) { clearInterval(refreshTimer); }
  refreshTimer = setInterval(() => loadETA(index), 30000);
}

function removeEtaPanel() {
  const old = document.getElementById('eta-inline-panel');
  if (old) old.remove();
}

// ===== 載入 ETA =====
async function loadETA(index) {
  const stop = currentStops[index];
  const route = currentDirections[currentDirIndex];
  const etaPanel = document.getElementById('eta-inline-panel');

  if (!stop || !route || !etaPanel) return;

  try {
    let url;
    if (currentCompany === 'KMB') {
      url = `${KMB_API}/eta/${stop.id}/${route.route}/${route.service_type}`;
    } else if (currentCompany === 'CTB') {
      url = `${CTB_BATCH_API}/stop-eta/CTB/${stop.id}`;
    } else if (currentCompany === 'GMB') {
      url = `${GMB_API}/eta/stop/${stop.id}`;
    }

    const res = await fetch(url);
    const data = await res.json();

    let etas = [];
    if (currentCompany === 'KMB') {
      etas = (data.data || []).filter(e => e.eta && e.dir === route.dir);
    } else if (currentCompany === 'CTB') {
      etas = (data.data || []).filter(e => e.eta && e.route === route.route && e.dir === route.dir);
    } else if (currentCompany === 'GMB') {
      for (const item of (data.data || [])) {
        if (item.eta && Array.isArray(item.eta)) {
          etas = etas.concat(item.eta);
        }
      }
    }
    etas = etas.slice(0, 4);

    // 地圖 HTML
    let mapHtml = '';
    if (stop.lat && stop.long) {
      const mapUrl = `https://maps.google.com/maps?q=${stop.lat},${stop.long}&z=17&output=embed`;
      const googleMapsLink = `https://www.google.com/maps/search/?api=1&query=${stop.lat},${stop.long}`;
      mapHtml = `
        <div class="stop-map">
          <iframe src="${mapUrl}" loading="lazy"></iframe>
        </div>
        <a class="map-link" href="${googleMapsLink}" target="_blank">📍 開啟 Google Maps</a>
      `;
    }

    if (etas.length === 0) {
      etaPanel.innerHTML = `
        <div class="eta-inline-header">
          <span class="eta-inline-title">📍 ${stop.name} (${route.route})</span>
          <button class="refresh-btn" onclick="loadETA(${index})">刷新</button>
        </div>
        <div class="eta-empty">暫無到站數據</div>
        ${mapHtml}
      `;
      return;
    }

    const now = new Date();
    const etaHtml = etas.map(e => {
      const etaTime = new Date(e.eta || e.timestamp);
      const diffMs = etaTime - now;
      const diffMin = Math.round(diffMs / 60000);
      const timeStr = etaTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
      const countdown = diffMin > 0 ? `${diffMin} 分鐘後` : (diffMin === 0 ? '即將到達' : '已過站');
      const dest = (e.dest && e.dest.zh) || e.dest_tc || e.dest || '';
      return `
        <div class="eta-item">
          <div class="eta-time">${timeStr}</div>
          <div class="eta-countdown">${countdown}</div>
          <div class="eta-dest">${dest}</div>
        </div>
      `;
    }).join('');

    const timeStr = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });

    etaPanel.innerHTML = `
      <div class="eta-inline-header">
        <span class="eta-inline-title">📍 ${stop.name} (${route.route})</span>
        <button class="refresh-btn" onclick="loadETA(${index})">刷新</button>
      </div>
      <ul class="eta-list">${etaHtml}</ul>
      <div style="font-size:10px;color:#6e7681;text-align:right;">最後更新 ${timeStr}</div>
      ${mapHtml}
    `;
  } catch (err) {
    etaPanel.innerHTML = `
      <div class="eta-inline-header">
        <span class="eta-inline-title">📍 ${stop.name}</span>
      </div>
      <div class="error" style="padding:8px;font-size:12px;">載入失敗：${err.message}</div>
    `;
  }
}
</script>
