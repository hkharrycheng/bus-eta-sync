<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港巴士到站查詢</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', 'Microsoft YaHei', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 16px;
  }
  .container { max-width: 700px; margin: 0 auto; }
  h1 {
    font-size: 20px;
    margin-bottom: 16px;
    color: #58a6ff;
    text-align: center;
  }
  .company-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .company-tab {
    flex: 1;
    padding: 10px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }
  .company-tab.active {
    background: #1f6feb;
    border-color: #1f6feb;
    color: white;
  }
  .company-tab.kmb.active { background: #d40000; border-color: #d40000; }
  .company-tab.ctb.active { background: #f5a623; border-color: #f5a623; color: #000; }
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    outline: none;
  }
  input[type="text"]:focus { border-color: #58a6ff; }
  button {
    padding: 12px 20px;
    font-size: 15px;
    background: #238636;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #30363d; cursor: not-allowed; }
  .direction-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .dir-tab {
    flex: 1;
    padding: 10px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
  }
  .dir-tab.active {
    background: #1f6feb;
    border-color: #1f6feb;
    color: white;
  }
  .dir-tab .route-name { font-weight: 600; font-size: 14px; }
  .dir-tab .route-desc { font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .stop-list { list-style: none; }
  .stop-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .stop-item:hover {
    border-color: #58a6ff;
    background: #1c2128;
  }
  .stop-item.selected {
    border-color: #f5a623;
    background: #1c2128;
  }
  .stop-seq {
    width: 28px;
    height: 28px;
    background: #30363d;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .stop-info { flex: 1; min-width: 0; }
  .stop-name { font-size: 14px; font-weight: 500; margin-bottom: 1px; }
  .stop-id {
    font-size: 11px;
    color: #8b949e;
    font-family: 'Consolas', monospace;
  }
  .stop-eta-mini {
    font-size: 12px;
    color: #3fb950;
    font-weight: 600;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .loading {
    text-align: center;
    padding: 30px;
    color: #8b949e;
  }
  .error {
    background: #3d1f1f;
    border: 1px solid #f85149;
    color: #f85149;
    padding: 14px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
  }
  .eta-panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .eta-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #f5a623;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .eta-refresh {
    font-size: 12px;
    color: #8b949e;
    font-weight: normal;
  }
  .eta-list { list-style: none; }
  .eta-item {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #21262d;
  }
  .eta-item:last-child { border-bottom: none; }
  .eta-time {
    font-size: 18px;
    font-weight: 700;
    color: #3fb950;
    min-width: 70px;
  }
  .eta-countdown {
    font-size: 13px;
    color: #8b949e;
    margin-left: 12px;
  }
  .eta-remark {
    font-size: 12px;
    color: #8b949e;
    margin-left: auto;
    text-align: right;
  }
  .eta-empty {
    color: #8b949e;
    text-align: center;
    padding: 16px;
    font-size: 14px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #238636;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show { opacity: 1; }
  .hint {
    text-align: center;
    color: #8b949e;
    font-size: 12px;
    margin-top: 12px;
  }
  .refresh-btn {
    padding: 6px 12px;
    font-size: 12px;
    background: #30363d;
    border-radius: 6px;
  }
  .refresh-btn:hover { background: #484f58; }
</style>
</head>
<body>
<div class="container">
  <h1>🚌 香港巴士到站查詢</h1>
  
  <div class="company-tabs">
    <div class="company-tab kmb active" id="tabKMB" onclick="switchCompany('KMB')">九巴 KMB</div>
    <div class="company-tab ctb" id="tabCTB" onclick="switchCompany('CTB')">城巴/新巴</div>
  </div>
  
  <div class="search-box">
    <input type="text" id="routeInput" placeholder="輸入路線號，例如：101、S1、A11" />
    <button onclick="searchRoute()">查詢</button>
  </div>

  <div id="directionTabs"></div>
  <div id="etaPanel"></div>
  <div id="result"></div>
  
  <div class="hint">點擊車站查看到站時間 | 資料來源：data.gov.hk</div>
</div>

<div class="toast" id="toast">已複製！</div>

<script>
let currentCompany = 'KMB';
let currentDirections = [];
let currentDirIndex = 0;
let currentStops = [];
let selectedStopIndex = -1;
let refreshTimer = null;

const KMB_API = 'https://data.etabus.gov.hk/v1/transport/kmb';
const CTB_API = 'https://rt.data.gov.hk/v1/transport/citybus-nwfb';
const CTB_BATCH_API = 'https://rt.data.gov.hk/v1/transport/batch';

document.getElementById('routeInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') searchRoute();
});

function switchCompany(company) {
  currentCompany = company;
  document.getElementById('tabKMB').classList.toggle('active', company === 'KMB');
  document.getElementById('tabCTB').classList.toggle('active', company === 'CTB');
  document.getElementById('directionTabs').innerHTML = '';
  document.getElementById('result').innerHTML = '';
  document.getElementById('etaPanel').innerHTML = '';
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

async function searchRoute() {
  const route = document.getElementById('routeInput').value.trim().toUpperCase();
  if (!route) return;
  
  const resultDiv = document.getElementById('result');
  const tabsDiv = document.getElementById('directionTabs');
  const etaDiv = document.getElementById('etaPanel');
  resultDiv.innerHTML = '<div class="loading">查詢中...</div>';
  tabsDiv.innerHTML = '';
  etaDiv.innerHTML = '';
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  
  try {
    let routes = [];
    if (currentCompany === 'KMB') {
      const res = await fetch(`${KMB_API}/route/`);
      const data = await res.json();
      routes = data.data.filter(r => r.route === route);
    } else {
      const res = await fetch(`${CTB_API}/route/ctb`);
      const data = await res.json();
      const matched = data.data.filter(r => r.route === route);
      // 城巴路線列表唔返回方向，手動建立去程/回程
      if (matched.length > 0 && !matched[0].dir) {
        const r = matched[0];
        routes = [
          { ...r, dir: 'O', orig_tc: r.orig_tc, dest_tc: r.dest_tc },
          { ...r, dir: 'I', orig_tc: r.dest_tc, dest_tc: r.orig_tc }
        ];
      } else {
        routes = matched;
      }
    }
    
    if (routes.length === 0) {
      resultDiv.innerHTML = `<div class="error">搵唔到路線「${route}」<br>請檢查路線號或巴士公司</div>`;
      return;
    }
    
    currentDirections = routes;
    currentDirIndex = 0;
    renderDirectionTabs();
    loadStops();
  } catch (err) {
    resultDiv.innerHTML = `<div class="error">查詢失敗：${err.message}</div>`;
  }
}

function renderDirectionTabs() {
  const tabsDiv = document.getElementById('directionTabs');
  if (currentDirections.length <= 1) { tabsDiv.innerHTML = ''; return; }
  
  tabsDiv.innerHTML = currentDirections.map((r, i) => {
    let orig, dest;
    if (currentCompany === 'KMB') {
      orig = r.orig_tc; dest = r.dest_tc;
    } else {
      orig = r.orig_tc || r.origin_tc || '';
      dest = r.dest_tc || r.destination_tc || '';
    }
    return `
      <div class="dir-tab ${i === currentDirIndex ? 'active' : ''}" onclick="switchDir(${i})">
        <div class="route-name">${(r.direction === 'I' || r.direction === '2' || r.dir === 'I' || r.bound === 'I') ? '回程' : '去程'}</div>
        <div class="route-desc">${orig} → ${dest}</div>
      </div>
    `;
  }).join('');
}

function switchDir(index) {
  currentDirIndex = index;
  selectedStopIndex = -1;
  document.getElementById('etaPanel').innerHTML = '';
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  renderDirectionTabs();
  loadStops();
}

async function loadStops() {
  const route = currentDirections[currentDirIndex];
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = '<div class="loading">載入車站列表...</div>';
  
  try {
    let url;
    if (currentCompany === 'KMB') {
      const bound = route.bound === 'O' ? 'outbound' : 'inbound';
      url = `${KMB_API}/route-stop/${route.route}/${bound}/${route.service_type}`;
    } else {
      const bound = route.dir === 'I' ? 'inbound' : 'outbound';
      url = `${CTB_API}/route-stop/ctb/${route.route}/${bound}`;
    }
    
    const res = await fetch(url);
    const data = await res.json();
    
    if (!data.data || data.data.length === 0) {
      resultDiv.innerHTML = '<div class="error">呢條路線冇車站資料</div>';
      return;
    }
    
    const stops = [];
    for (const item of data.data) {
      let stopId, seq;
      if (currentCompany === 'KMB') {
        stopId = item.stop; seq = item.seq;
      } else {
        stopId = item.stop; seq = item.seq || item.stop_seq;
      }
      const stopRes = await fetch(`${currentCompany === 'KMB' ? KMB_API : CTB_API}/stop/${stopId}`);
      const stopData = await stopRes.json();
      stops.push({
        seq: seq,
        id: stopId,
        name: stopData.data.name_tc || stopData.data.name || ''
      });
    }
    
    currentStops = stops;
    renderStops(stops);
  } catch (err) {
    resultDiv.innerHTML = `<div class="error">載入失敗：${err.message}</div>`;
  }
}

function renderStops(stops) {
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = `
    <ul class="stop-list">
      ${stops.map((s, i) => `
        <li class="stop-item ${i === selectedStopIndex ? 'selected' : ''}" onclick="selectStop(${i})">
          <div class="stop-seq">${s.seq}</div>
          <div class="stop-info">
            <div class="stop-name">${s.name}</div>
            <div class="stop-id">${s.id}</div>
          </div>
        </li>
      `).join('')}
    </ul>
  `;
}

async function selectStop(index) {
  selectedStopIndex = index;
  renderStops(currentStops);
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  await loadETA();
  refreshTimer = setInterval(loadETA, 30000);
}

async function loadETA() {
  const stop = currentStops[selectedStopIndex];
  const route = currentDirections[currentDirIndex];
  const etaDiv = document.getElementById('etaPanel');
  
  if (!stop || !route) return;
  
  etaDiv.innerHTML = `
    <div class="eta-panel">
      <div class="eta-title">
        <span>📍 ${stop.name}</span>
        <span class="eta-refresh">每30秒自動更新</span>
      </div>
      <div class="loading">載入到站時間...</div>
    </div>
  `;
  
  try {
    let url;
    if (currentCompany === 'KMB') {
      url = `${KMB_API}/eta/${stop.id}/${route.route}/${route.service_type}`;
    } else {
      url = `${CTB_BATCH_API}/stop-eta/CTB/${stop.id}`;
    }
    
    const res = await fetch(url);
    const data = await res.json();
    
    let etas = (data.data || []).filter(e => e.eta);
    if (currentCompany === 'CTB') {
      etas = etas.filter(e => e.route === route.route && e.dir === route.dir);
    }
    etas = etas.slice(0, 4);
    
    if (etas.length === 0) {
      etaDiv.innerHTML = `
        <div class="eta-panel">
          <div class="eta-title">
            <span>📍 ${stop.name}</span>
            <button class="refresh-btn" onclick="loadETA()">刷新</button>
          </div>
          <div class="eta-empty">暫無到站數據</div>
        </div>
      `;
      return;
    }
    
    const now = new Date();
    const etaHtml = etas.map(e => {
      const etaTime = new Date(e.eta);
      const diffMs = etaTime - now;
      const diffMin = Math.round(diffMs / 60000);
      const timeStr = etaTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
      const countdown = diffMin > 0 ? `${diffMin} 分鐘後` : (diffMin === 0 ? '即將到達' : '已過站');
      const remark = e.rmk_tc || e.remarks_tc || e.rmk || '';
      const dest = e.dest_tc || e.dest || '';
      return `
        <div class="eta-item">
          <div class="eta-time">${timeStr}</div>
          <div class="eta-countdown">${countdown}${dest ? ' · ' + dest : ''}</div>
          <div class="eta-remark">${remark}</div>
        </div>
      `;
    }).join('');
    
    etaDiv.innerHTML = `
      <div class="eta-panel">
        <div class="eta-title">
          <span>📍 ${stop.name} (${route.route})</span>
          <button class="refresh-btn" onclick="loadETA()">立即刷新</button>
        </div>
        <ul class="eta-list">${etaHtml}</ul>
      </div>
    `;
  } catch (err) {
    etaDiv.innerHTML = `
      <div class="eta-panel">
        <div class="eta-title"><span>📍 ${stop.name}</span></div>
        <div class="error">載入失敗：${err.message}</div>
      </div>
    `;
  }
}
</script>
</body>
</html>
